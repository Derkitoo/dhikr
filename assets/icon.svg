<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Circular Tasbih Beads Ring -->
  <g transform="translate(256, 230)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="8, 12" stroke-opacity="0.4" />
    
    <!-- Beads -->
    <circle cx="0" cy="-140" r="14" fill="url(#goldGrad)" filter="url(#glow)" />
    <circle cx="60" cy="-126" r="11" fill="#34d399" />
    <circle cx="112" cy="-84" r="11" fill="#34d399" />
    <circle cx="140" cy="-24" r="11" fill="#34d399" />
    <circle cx="132" cy="48" r="11" fill="#34d399" />
    <circle cx="88" cy="108" r="11" fill="#34d399" />
    <circle cx="28" cy="136" r="11" fill="#34d399" />

    <circle cx="-60" cy="-126" r="11" fill="#34d399" />
    <circle cx="-112" cy="-84" r="11" fill="#34d399" />
    <circle cx="-140" cy="-24" r="11" fill="#34d399" />
    <circle cx="-132" cy="48" r="11" fill="#34d399" />
    <circle cx="-88" cy="108" r="11" fill="#34d399" />
    <circle cx="-28" cy="136" r="11" fill="#34d399" />

    <!-- Center Crescent & Star -->
    <path d="M-20 -50 A 65 65 0 1 0 55 35 A 50 50 0 1 1 -20 -50 Z" fill="url(#goldGrad)" filter="url(#glow)" />
    <polygon points="25,-35 30,-22 43,-25 35,-14 43,-3 30,-5 25,8 20,-5 7,-3 15,-14 7,-25 20,-22" fill="#fde047" />

    <!-- Tassel at bottom -->
    <line x1="0" y1="140" x2="0" y2="185" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="0" cy="195" r="12" fill="url(#goldGrad)" />
    <path d="M-8 205 L8 205 L16 250 L-16 250 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
